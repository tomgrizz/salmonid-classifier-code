__include__: ['./deimv2_dinov3_l_coco.yml']

# DEIMv2-L v2.3 "PROXIMITY-AWARE" run. Same 960px recipe as v2.2 (real DINOv3 ViT-S/16, ColorJitter no
# RGB-permute, capped ZoomOut, paste-CopyBlend, rescaled schedule, matcher_change fires) -- the ONLY
# change is the DATA: v2.2's COCO was 100% single-box, so the model never saw two fish together and
# mislabelled a Coho as Chinook whenever it trailed one (Tom's two-fish-proximity finding; near a Chinook
# the Coho track scored 3-22% Coho, vs 78-84% once separated). v2.3 adds 4,000 MULTI-FISH images (8,000
# boxes incl. 928 Coho-beside-Chinook) mined from the corpus: the labelled fish keeps its human species
# (correct even for the confused Coho), the confident companion gets the detector's class (reliable for
# the leading Chinook). No new annotation. Coho boxes 5,692 -> 9,073. Goal: teach adjacent-fish
# discrimination at the detector so the proximity Coho->Chinook misclassification is fixed at the source.
# Select the deploy checkpoint by tracked-op F1 (with the confidence-aware Coho vote), NOT lab AP.
num_classes: 6
remap_mscoco_category: False
output_dir: ./outputs/deimv2_fish_l_v23
checkpoint_freq: 5
eval_spatial_size: [960, 960]
print_freq: 100

epoches: 30
flat_epoch: 15
no_aug_epoch: 5

DEIMCriterion:
  matcher:
    matcher_change_epoch: 25

train_dataloader:
  total_batch_size: 16
  num_workers: 10
  dataset:
    img_folder: /
    ann_file: C:/ssl_cache/deimv2_fish_6class_masked_v23/train.json
    transforms:
      ops:
        - {type: Mosaic, output_size: 480, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5],
           probability: 1.0, fill_value: 0, use_cache: True, max_cached_images: 50, random_pop: True}
        - {type: ColorJitter, brightness: 0.2, contrast: 0.2, saturation: 0.1, hue: 0.0}
        - {type: RandomZoomOut, fill: 0, side_range: [1.0, 2.0]}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [960, 960], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: [4, 15, 25]
        ops: ['Mosaic', 'ColorJitter', 'RandomZoomOut', 'RandomIoUCrop']
      mosaic_prob: 0.5
  collate_fn:
    base_size: 960
    base_size_repeat: null
    mixup_prob: 0.5
    mixup_epochs: [4, 15]
    stop_epoch: 25
    copyblend_prob: 0.5
    copyblend_epochs: [4, 25]
    copyblend_type: paste

val_dataloader:
  total_batch_size: 16
  num_workers: 10
  dataset:
    img_folder: /
    ann_file: C:/ssl_cache/deimv2_fish_6class_masked_v23/val.json
    transforms:
      ops:
        - {type: Resize, size: [960, 960], }
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
