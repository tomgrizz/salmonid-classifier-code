__include__: ['./deimv2_dinov3_x_coco.yml']

# DEIMv2-X v2.6 = WARM-START from v2.5 checkpoint0019 (the op-peak) — continue-train on the v2.5 COCO +
# TARGETED SAM2 synth aimed at the residual chrome confusions (Coho-behind-Chinook proximity + chrome
# Atlantic-Rainbow + Coho-Rainbow pairs + Coho/Rainbow partial-exposure), to "get the model seeing Coho and
# Rainbow" (Tom, 2026-07-05). Gentle warm-start so the already-strong classes aren't forgotten:
#   - lr 0.0001 (< v2.5's 0.00025) — small nudge from the v2.5 basin.
#   - 10 epochs (short continuation, not 30 from scratch); schedule scaled to 10ep so the no-aug tail fires.
#   - trained via `train.py -t outputs/deimv2_fish_x_v25/checkpoint0019.pth` (load v2.5 weights as init).
# Data = C:/ssl_cache/deimv2_fish_6class_masked_v26/train.json (v2.5 COCO + 4,300 targeted synth,
# test_set_v6 leak-clean verified). Select checkpoint on tracked-op + test_set_v6; leak guard stays.
num_classes: 6
remap_mscoco_category: False
output_dir: ./outputs/deimv2_fish_x_v26
checkpoint_freq: 2
eval_spatial_size: [960, 960]
print_freq: 100

epoches: 10
flat_epoch: 5
no_aug_epoch: 3

optimizer:
  lr: 0.0001

DEIMCriterion:
  matcher:
    matcher_change_epoch: 8

train_dataloader:
  total_batch_size: 8
  num_workers: 8
  dataset:
    img_folder: /
    ann_file: C:/ssl_cache/deimv2_fish_6class_masked_v26/train.json
    transforms:
      ops:
        - {type: Mosaic, output_size: 480, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5],
           probability: 1.0, fill_value: 0, use_cache: True, max_cached_images: 50, random_pop: True}
        - {type: ColorJitter, brightness: 0.2, contrast: 0.2, saturation: 0.1, hue: 0.0}
        - {type: RandomZoomOut, fill: 0, side_range: [1.0, 2.0]}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [960, 960], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: [2, 5, 8]
        ops: ['Mosaic', 'ColorJitter', 'RandomZoomOut', 'RandomIoUCrop']
      mosaic_prob: 0.5
  collate_fn:
    base_size: 960
    base_size_repeat: null
    mixup_prob: 0.5
    mixup_epochs: [2, 5]
    stop_epoch: 8
    copyblend_prob: 0.5
    copyblend_epochs: [2, 8]
    copyblend_type: paste

val_dataloader:
  total_batch_size: 8
  num_workers: 8
  dataset:
    img_folder: /
    ann_file: C:/ssl_cache/deimv2_fish_6class_masked_v26/val_clean.json
    transforms:
      ops:
        - {type: Resize, size: [960, 960], }
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
